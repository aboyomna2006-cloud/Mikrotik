<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شبكة إنترنت أبو يمنى</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 24px;
            color: #00ffcc;
            margin-bottom: 5px;
        }
        .cards-container {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        .card {
            background: #131b2e;
            border: 1px solid #1f293d;
            border-radius: 12px;
            padding: 15px;
            flex: 1;
            text-align: center;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:active {
            transform: scale(0.97);
        }
        /* نافذة التكبير (Modal) للضغط المطول */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: #131b2e;
            border: 2px solid #00ffcc;
            border-radius: 16px;
            padding: 25px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            position: relative;
        }
        .close-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>شبكة إنترنت أبو يمنى</h1>
        <p>السيرفر نشط الآن 🟢</p>
    </div>

    <div class="cards-container">
        <!-- كارت الباقة (بدون جملة 30 يوم القديمة) -->
        <div class="card">
            <h3>الباقة الحالية</h3>
            <p>متبقي: 387 GB</p>
        </div>

        <!-- كارت سحب اليوم (مخصص للضغط المطول Hold) -->
        <div class="card" id="dailyCard">
            <h3>سحب اليوم (in1)</h3>
            <p>السحب: 8.8 GB (35%)</p>
        </div>
    </div>

    <!-- نافذة العرض المطول (Modal) -->
    <div class="modal-overlay" id="zoomModal">
        <div class="modal-content">
            <h3 style="color: #00ffcc; margin-bottom: 10px;">تفاصيل سحب اليوم</h3>
            <p style="font-size: 16px; line-height: 1.6;">إجمالي السحب: 8.8 GB<br>المعدل المسموح: 25.0 GB<br>المتبقي اليوم: 16.2 GB</p>
            <button class="close-btn" id="closeModal">رجوع</button>
        </div>
    </div>

    <script>
        const dailyCard = document.getElementById('dailyCard');
        const zoomModal = document.getElementById('zoomModal');
        const closeModal = document.getElementById('closeModal');
        let pressTimer = null;

        // تفعيل الضغط المطول (Hold) الحقيقي بدون زوم متصفح
        dailyCard.addEventListener('touchstart', (e) => {
            pressTimer = setTimeout(() => {
                zoomModal.classList.add('active');
            }, 600); // 600 مللي ثانية ضغط مستمر
        });

        dailyCard.addEventListener('touchend', () => {
            clearTimeout(pressTimer);
        });

        dailyCard.addEventListener('touchmove', () => {
            clearTimeout(pressTimer);
        });

        // للدعم على الكمبيوتر (الماوس كليك مطول)
        dailyCard.addEventListener('mousedown', () => {
            pressTimer = setTimeout(() => {
                zoomModal.classList.add('active');
            }, 600);
        });

        dailyCard.addEventListener('mouseup', () => {
            clearTimeout(pressTimer);
        });

        closeModal.addEventListener('click', () => {
            zoomModal.classList.remove('active');
        });
    </script>
</body>
</html>
