<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>إضافة مستخدم - WinBox</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b111a;
      --card-bg: #121c2a;
      --item-bg: #0c141f;
      --card-border: #263852;
      --accent-cyan: #00e5ff;
      --accent-amber: #ffab00;
      --accent-green: #00e676;
      --accent-red: #ff3d71;
      --text-main: #ffffff;
      --text-sub: #9cb2cc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text-main);
      padding: 12px;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .winbox-window {
      width: 100%;
      max-width: 450px;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 18px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }
    .win-header {
      background: linear-gradient(90deg, #162638, #121c2a);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
    }
    .win-title { font-size: 16px; font-weight: 800; color: var(--accent-cyan); }
    .win-badge { font-size: 12px; background: rgba(0, 229, 255, 0.14); color: var(--accent-cyan); padding: 4px 10px; border-radius: 8px; font-weight: 700; }

    .form-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-label { font-size: 13px; color: var(--text-sub); font-weight: 700; }

    .text-input {
      width: 100%;
      background: var(--item-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: #fff;
      padding: 11px 12px;
      font-size: 15px;
      outline: none;
      direction: ltr;
      text-align: left;
    }
    .text-input:focus { border-color: var(--accent-cyan); }

    .btn-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .opt-btn {
      background: var(--item-bg);
      border: 1.5px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 6px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: 0.15s;
    }
    .opt-btn.active {
      background: linear-gradient(135deg, #ffab00, #ff6d00);
      border-color: #ffd54f;
      color: #0b111a;
      font-weight: 900;
      box-shadow: 0 4px 14px rgba(255, 171, 0, 0.35);
    }

    .actions-row { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 6px; }
    .btn-cancel {
      background: rgba(255, 61, 113, 0.15);
      border: 1px solid var(--accent-red);
      color: var(--accent-red);
      padding: 12px;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-submit {
      background: linear-gradient(90deg, #00e676, #00b0ff);
      border: none;
      color: #08121e;
      padding: 12px;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 230, 118, 0.3);
    }
  </style>
</head>
<body>
  <div class="winbox-window">
    <div class="win-header">
      <div class="win-title">➕ إضافة مشترك جديد</div>
      <div class="win-badge">Hotspot • out</div>
    </div>

    <div class="form-body">
      <div class="field-group">
        <label class="field-label">👤 اسم المستخدم (User)</label>
        <input type="text" id="uName" class="text-input" placeholder="مثال: ahmed2026" oninput="updateAutoComment()">
      </div>

      <div class="field-group">
        <label class="field-label">🔑 كلمة المرور (Password)</label>
        <input type="text" id="uPass" class="text-input" placeholder="مثال: 1234">
      </div>

      <div class="field-group">
        <label class="field-label">🚀 البروفايل (السرعة)</label>
        <div class="btn-grid-2">
          <button type="button" class="opt-btn active" onclick="selectProf('512+', this)">512+ (الأساسي)</button>
          <button type="button" class="opt-btn" onclick="selectProf('120K/400K', this)">120K/400K</button>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">📦 الباقة (الجيجات)</label>
        <div class="btn-grid-3">
          <button type="button" class="opt-btn" onclick="selectGb('12', this)">12 جيجا</button>
          <button type="button" class="opt-btn active" onclick="selectGb('15', this)">15 جيجا</button>
          <button type="button" class="opt-btn" onclick="selectGb('20', this)">20 جيجا</button>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">💬 الكومنت (تاريخ الانتهاء تلقائي +30 يوم)</label>
        <input type="text" id="uComm" class="text-input" placeholder="Name To DD-MM-YYYY">
      </div>

      <div class="actions-row">
        <button type="button" class="btn-cancel" onclick="if(tg) tg.close()">إلغاء</button>
        <button type="button" class="btn-submit" onclick="submitUser()">✅ إنشاء الكارت</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }

    let selectedProf = '512+';
    let selectedGb = '15';
    let commEdited = false;

    document.getElementById('uComm').addEventListener('input', () => { commEdited = true; });

    function getExpiryDate() {
      const d = new Date();
      d.setDate(d.getDate() + 30);
      return `${d.getDate()}-${d.getMonth() + 1}-${d.getFullYear()}`;
    }

    function updateAutoComment() {
      if (commEdited) return;
      const name = document.getElementById('uName').value.trim();
      document.getElementById('uComm').value = name ? `${name} To ${getExpiryDate()}` : '';
    }

    function selectProf(val, el) {
      selectedProf = val;
      el.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }

    function selectGb(val, el) {
      selectedGb = val;
      el.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }

    function submitUser() {
      const u = document.getElementById('uName').value.trim();
      const p = document.getElementById('uPass').value.trim();
      const c = document.getElementById('uComm').value.trim() || `${u} To ${getExpiryDate()}`;
      if (!u || !p) {
        alert('برجاء إدخال اسم المستخدم وكلمة المرور');
        return;
      }
      const payload = `/add_user|${u}|${p}|${selectedProf}|${selectedGb}|${c}`;
      if (tg) {
        tg.sendData(payload);
      } else {
        alert(payload);
      }
    }
  </script>
</body>
</html>
