<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>قائمة المشتركين</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #07090e;
      --gold: #f5b942;
      --gold-bright: #ffe18d;
      --gold-border: rgba(245, 190, 100, 0.5);
      --green: #10e87a;
      --red: #ff3b6b;
      --text-main: #ffffff;
      --text-sub: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      background: radial-gradient(ellipse at 50% 6%, #262019 0%, transparent 35%), linear-gradient(180deg, #0a0c10, #030405 80%);
      color: var(--text-main);
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
    }

    body {
      padding: 8px 10px 64px;
      display: flex;
      justify-content: center;
    }

    .app-shell {
      width: 100%;
      max-width: 490px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 15px;
      border: 1px solid var(--gold-border);
      background: linear-gradient(151deg, rgba(59, 58, 56, 0.72), rgba(16, 18, 20, 0.98) 50%, #080a0d 90%);
      box-shadow: inset 0 1px 1px rgba(255, 245, 206, 0.4), 0 6px 14px rgba(0, 0, 0, 0.55);
      flex-shrink: 0;
    }

    .top-title {
      font-size: 15px;
      font-weight: 900;
      color: var(--gold-bright);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .count-pill {
      font-size: 12px;
      font-weight: 800;
      color: #5cffaa;
      background: rgba(16, 232, 122, 0.14);
      border: 1px solid rgba(16, 232, 122, 0.45);
      padding: 3px 10px;
      border-radius: 14px;
      cursor: pointer;
    }

    .search-row {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      background: #0e1218;
      border: 1px solid rgba(245, 190, 100, 0.42);
      border-radius: 12px;
      color: #fff;
      padding: 8px 12px;
      font-size: 13.5px;
      font-weight: 700;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--gold-bright);
    }

    .btn-all {
      background: linear-gradient(151deg, rgba(59, 58, 56, 0.72), rgba(16, 18, 20, 0.98));
      border: 1px solid rgba(245, 190, 100, 0.48);
      color: var(--gold-bright);
      border-radius: 12px;
      padding: 0 12px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
    }

    .users-scroll {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-left: 2px;
      padding-right: 2px;
      -webkit-overflow-scrolling: touch;
    }

    .user-row {
      min-height: 54px;
      border-radius: 13px;
      padding: 6px 10px;
      border: 1px solid rgba(245, 190, 100, 0.36);
      background: linear-gradient(151deg, rgba(52, 50, 48, 0.65), rgba(14, 16, 20, 0.96) 55%, #080a0d 95%);
      box-shadow: inset 0 1px 0 rgba(255, 245, 206, 0.25), 0 4px 10px rgba(0, 0, 0, 0.45);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      -webkit-user-select: none;
      user-select: none;
      touch-action: pan-y;
    }

    .user-row.long-ready {
      border-color: var(--gold-bright);
      box-shadow: 0 0 14px rgba(245, 185, 66, 0.38), inset 0 1px 0 rgba(255, 245, 206, 0.45);
      transform: scale(0.986);
    }

    .user-row:active {
      transform: scale(0.985);
      border-color: var(--gold-bright);
    }

    .u-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2px;
      text-align: right;
    }

    .u-primary {
      font-size: 13.5px;
      font-weight: 900;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      direction: ltr;
      text-align: right;
    }

    .u-secondary {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      direction: ltr;
      text-align: right;
    }

    .u-meta-tag {
      color: var(--gold-bright);
      font-weight: 800;
    }

    .mini-ring-wrap {
      position: relative;
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mini-ring-wrap svg {
      width: 40px;
      height: 40px;
      transform: rotate(-90deg);
    }

    .m-bg {
      fill: none;
      stroke: rgba(175, 181, 195, 0.25);
      stroke-width: 4.5;
    }

    .m-fg {
      fill: none;
      stroke: url(#miniGoldGrad);
      stroke-width: 4.5;
      stroke-linecap: round;
    }

    .m-fg-red {
      fill: none;
      stroke: url(#miniRedGrad);
      stroke-width: 4.5;
      stroke-linecap: round;
    }

    .mini-pct {
      position: absolute;
      font-size: 10px;
      font-weight: 900;
      color: #ffffff;
      direction: ltr;
    }

    .footer-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      flex-shrink: 0;
      margin-bottom: 14px;
    }

    .btn-foot {
      height: 42px;
      border-radius: 13px;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      border: 1px solid rgba(245, 190, 100, 0.48);
      background: linear-gradient(151deg, rgba(59, 58, 56, 0.72), rgba(16, 18, 20, 0.98));
      color: var(--gold-bright);
    }

    .btn-foot.close {
      border-color: rgba(255, 59, 107, 0.5);
      color: #ff6b8b;
    }

    /* نافذة الفوكس من صغير لكبير وسط الشاشة */
    .focus-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 5, 9, 0.78);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20000;
      padding: 18px;
      opacity: 0;
      transition: opacity 0.24s ease;
    }

    .focus-backdrop.show {
      display: flex;
      opacity: 1;
    }

    .focus-card {
      width: 100%;
      max-width: 355px;
      border-radius: 22px;
      border: 1.5px solid rgba(255, 210, 110, 0.68);
      background: linear-gradient(155deg, rgba(58, 55, 50, 0.92), rgba(15, 18, 24, 0.99) 50%, #07090d 95%);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.85), 0 0 26px rgba(245, 185, 66, 0.22), inset 0 1px 1px rgba(255, 245, 206, 0.45);
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transform: scale(0.32);
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.18, 0.9, 0.32, 1.08), opacity 0.22s ease;
    }

    .focus-backdrop.show .focus-card {
      transform: scale(1);
      opacity: 1;
    }

    .focus-head {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
    }

    .focus-title {
      font-size: 14.5px;
      font-weight: 900;
      color: var(--gold-bright);
    }

    .focus-x {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255, 59, 107, 0.5);
      background: rgba(255, 59, 107, 0.14);
      color: #ff6b8b;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }

    .big-ring-wrap {
      position: relative;
      width: 126px;
      height: 126px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 2px;
    }

    .big-ring-wrap svg {
      width: 126px;
      height: 126px;
      transform: rotate(-90deg);
    }

    .big-bg {
      fill: none;
      stroke: rgba(175, 181, 195, 0.25);
      stroke-width: 9;
    }

    .big-fg {
      fill: none;
      stroke: url(#miniGoldGrad);
      stroke-width: 9;
      stroke-linecap: round;
      filter: drop-shadow(0 0 8px rgba(245, 185, 66, 0.55));
    }

    .big-fg-red {
      fill: none;
      stroke: url(#miniRedGrad);
      stroke-width: 9;
      stroke-linecap: round;
      filter: drop-shadow(0 0 8px rgba(255, 45, 85, 0.75));
    }

    .big-pct {
      position: absolute;
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
      direction: ltr;
    }

    .focus-details-box {
      width: 100%;
      background: rgba(8, 11, 17, 0.85);
      border: 1px solid rgba(245, 190, 100, 0.28);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .focus-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.07);
      padding-bottom: 5px;
      font-size: 12.5px;
    }

    .focus-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .focus-lbl {
      color: var(--text-sub);
      font-weight: 700;
      white-space: nowrap;
    }

    .focus-val {
      color: #ffffff;
      font-weight: 800;
      direction: ltr;
      text-align: left;
      word-break: break-word;
    }

    .focus-val.gold {
      color: var(--gold-bright);
    }

    .focus-actions {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 8px;
    }

    .btn-focus-close {
      height: 40px;
      border-radius: 12px;
      border: 1px solid rgba(255, 59, 107, 0.5);
      background: rgba(255, 59, 107, 0.14);
      color: #ff6b8b;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-focus-renew {
      height: 40px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #f5b942, #d99116);
      color: #090d14;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute;">
    <defs>
      <linearGradient id="miniGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffe082" />
        <stop offset="100%" stop-color="#d98a00" />
      </linearGradient>
      <linearGradient id="miniRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ff8f00" />
        <stop offset="50%" stop-color="#ff2d55" />
        <stop offset="100%" stop-color="#ff1744" />
      </linearGradient>
    </defs>
  </svg>

  <div class="app-shell">
    <div class="top-bar">
      <div class="top-title">👥 قائمة المشتركين</div>
      <div class="count-pill" id="countBadge" onclick="fetchUsers()">جاري التحميل...</div>
    </div>

    <div class="search-row">
      <input type="text" id="qInput" class="search-input" placeholder="ابحث بالاسم أو الكومنت..." oninput="renderList()">
      <button type="button" class="btn-all" onclick="clearSearch()">الكل</button>
    </div>

    <div class="users-scroll" id="usersListBox"></div>

    <div class="footer-btns">
      <button type="button" class="btn-foot" id="navBackBtn" onclick="goBackNav()">🏠 الرئيسية</button>
      <button type="button" class="btn-foot close" onclick="closePage()">إغلاق</button>
    </div>
  </div>

  <div class="focus-backdrop" id="focusModal" onclick="if(event.target===this) closeFocusModal()">
    <div class="focus-card">
      <div class="focus-head">
        <div class="focus-title">📊 تفاصيل المشترك</div>
        <button type="button" class="focus-x" onclick="closeFocusModal()">✕</button>
      </div>

      <div class="big-ring-wrap">
        <svg viewBox="0 0 120 120">
          <circle class="big-bg" cx="60" cy="60" r="48"/>
          <circle class="big-fg" id="bigRingArc" cx="60" cy="60" r="48" stroke-dasharray="301.59" stroke-dashoffset="301.59"/>
          <circle class="big-fg-red" id="bigRedTipArc" cx="60" cy="60" r="48" stroke-dasharray="0 301.59" stroke-dashoffset="0" style="opacity:0;"/>
        </svg>
        <span class="big-pct" id="bigRingPct">0%</span>
      </div>

      <div class="focus-details-box">
        <div class="focus-row">
          <span class="focus-lbl">👤 المشترك:</span>
          <span class="focus-val gold" id="fUserName">-</span>
        </div>
        <div class="focus-row">
          <span class="focus-lbl">💬 الكومنت:</span>
          <span class="focus-val" id="fComment">-</span>
        </div>
        <div class="focus-row">
          <span class="focus-lbl">🚀 البروفايل:</span>
          <span class="focus-val" id="fProfile">-</span>
        </div>
        <div class="focus-row">
          <span class="focus-lbl">📦 الاستهلاك:</span>
          <span class="focus-val gold" id="fQuota">-</span>
        </div>
      </div>

      <div class="focus-actions">
        <button type="button" class="btn-focus-close" onclick="closeFocusModal()">إغلاق</button>
        <button type="button" class="btn-focus-renew" id="btnGoRenewFromFocus">🔄 تجديد / تعديل</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    const isInsideTelegram = !!(tg && tg.initData && tg.initData.length > 0);
    if (tg) { tg.ready(); tg.expand(); }

    const GH_TK = ["ghp_", "3C37QKdKnv044XpQn", "Ju0gbb6pVhB0k3ca3pZ"].join("");
    let allUsers = [];
    let activeFocusUserRawName = '';

    const urlParams = new URLSearchParams(window.location.search);
    const preUser = urlParams.get('user');
    const fromPage = urlParams.get('from');

    if (fromPage === 'active') {
      document.getElementById('navBackBtn').innerText = '🔙 رجوع للنشطين';
    }

    function goBackNav() {
      if (fromPage === 'active') {
        window.location.href = 'active.html';
      } else {
        window.location.href = 'panel.html';
      }
    }

    function closePage() {
      if (isInsideTelegram) { tg.close(); }
      else { window.location.href = 'panel.html'; }
    }

    if (preUser) {
      document.getElementById('qInput').value = preUser;
    }

    function clearSearch() {
      document.getElementById('qInput').value = '';
      renderList();
    }

    function openFocusModalByName(rawName) {
      const u = allUsers.find(item => String((item.n || '').trim()) === String(rawName).trim());
      if (!u) return;

      const nameStr = (u.n || '').trim();
      const commStr = (u.c || '').trim() || '-';
      const profStr = (u.p || '').trim() || '-';
      const usedGB = Number(u.u || 0) / 1024;
      const limGB = Number(u.l || 0);
      const pct = limGB > 0 ? Math.min(100, Math.round((usedGB / limGB) * 100)) : 0;
      const quotaStr = limGB > 0 ? `${usedGB.toFixed(1)} / ${limGB} GB` : `${usedGB.toFixed(1)} GB`;

      activeFocusUserRawName = nameStr;
      document.getElementById('fUserName').innerText = nameStr || '-';
      document.getElementById('fComment').innerText = commStr;
      document.getElementById('fProfile').innerText = profStr;
      document.getElementById('fQuota').innerText = quotaStr;
      document.getElementById('bigRingPct').innerText = `${pct}%`;

      const bigCirc = 301.59;
      const arc = document.getElementById('bigRingArc');
      const redArc = document.getElementById('bigRedTipArc');
      arc.style.strokeDashoffset = (bigCirc - (pct / 100) * bigCirc).toFixed(2);

      if (pct > 80) {
        const startLen = (0.8 * bigCirc).toFixed(2);
        const redLen = (((pct - 80) / 100) * bigCirc).toFixed(2);
        redArc.style.opacity = '1';
        redArc.style.strokeDasharray = `${redLen} ${bigCirc}`;
        redArc.style.strokeDashoffset = `-${startLen}`;
      } else {
        redArc.style.opacity = '0';
      }

      document.getElementById('btnGoRenewFromFocus').onclick = function() {
        window.location.href = `renew.html?user=${encodeURIComponent(activeFocusUserRawName)}`;
      };

      const backdrop = document.getElementById('focusModal');
      backdrop.style.display = 'flex';
      requestAnimationFrame(() => {
        backdrop.classList.add('show');
      });
    }

    function closeFocusModal() {
      const backdrop = document.getElementById('focusModal');
      backdrop.classList.remove('show');
      setTimeout(() => {
        if (!backdrop.classList.contains('show')) {
          backdrop.style.display = 'none';
        }
      }, 240);
    }

    function bindRowGestures() {
      const scrollBox = document.getElementById('usersListBox');
      const rows = document.querySelectorAll('.user-row');

      rows.forEach(row => {
        const rawName = row.getAttribute('data-user') || '';
        let holdTimer = null;
        let isLongReady = false;
        let startY = 0;
        let triggeredByPull = false;

        const clearHold = () => {
          clearTimeout(holdTimer);
          holdTimer = null;
        };

        const onStart = (clientY) => {
          triggeredByPull = false;
          isLongReady = false;
          startY = clientY;
          row.classList.remove('long-ready');
          clearHold();
          holdTimer = setTimeout(() => {
            isLongReady = true;
            row.classList.add('long-ready');
          }, 260);
        };

        const onMove = (e, clientY) => {
          const deltaY = clientY - startY;
          if (!isLongReady && Math.abs(deltaY) > 10) {
            clearHold();
            return;
          }
          if (isLongReady && !triggeredByPull && deltaY > 16) {
            triggeredByPull = true;
            if (e && e.cancelable) e.preventDefault();
            clearHold();
            row.classList.remove('long-ready');
            openFocusModalByName(rawName);
          }
        };

        const onEnd = () => {
          clearHold();
          row.classList.remove('long-ready');
          if (triggeredByPull) {
            setTimeout(() => { triggeredByPull = false; }, 160);
            return;
          }
          if (!isLongReady) {
            window.location.href = `renew.html?user=${encodeURIComponent(rawName)}`;
          }
          isLongReady = false;
        };

        row.addEventListener('touchstart', e => {
          if (e.touches && e.touches.length > 0) onStart(e.touches[0].clientY);
        }, { passive: true });

        row.addEventListener('touchmove', e => {
          if (e.touches && e.touches.length > 0) onMove(e, e.touches[0].clientY);
        }, { passive: false });

        row.addEventListener('touchend', () => onEnd());
        row.addEventListener('touchcancel', () => {
          clearHold();
          isLongReady = false;
          row.classList.remove('long-ready');
        });

        row.addEventListener('mousedown', e => {
          if (e.button !== 0) return;
          onStart(e.clientY);
        });

        row.addEventListener('mousemove', e => {
          if (e.buttons === 1) onMove(e, e.clientY);
        });

        row.addEventListener('mouseup', () => onEnd());
        row.addEventListener('mouseleave', () => {
          clearHold();
          isLongReady = false;
          row.classList.remove('long-ready');
        });
      });

      if (scrollBox && !scrollBox.dataset.pullGuardBound) {
        scrollBox.dataset.pullGuardBound = '1';
        let boxStartY = 0;
        scrollBox.addEventListener('touchstart', e => {
          if (e.touches && e.touches.length > 0) boxStartY = e.touches[0].clientY;
        }, { passive: true });
        scrollBox.addEventListener('touchmove', e => {
          if (!e.touches || e.touches.length === 0) return;
          if (scrollBox.scrollTop <= 0 && (e.touches[0].clientY - boxStartY) > 0) {
            if (e.cancelable) e.preventDefault();
          }
        }, { passive: false });
      }
    }

    async function fetchUsers() {
      const badge = document.getElementById('countBadge');
      badge.innerText = '🔄 تحديث...';
      try {
        const apiUrl = `https://api.github.com/repos/aboyomna2006-cloud/Mikrotik/contents/users.json?ref=main&_=${Date.now()}`;
        const res = await fetch(apiUrl, {
          cache: 'no-store',
          headers: { 'Authorization': `Bearer ${GH_TK}`, 'Accept': 'application/vnd.github.v3+json' }
        });
        if (res.ok) {
          const meta = await res.json();
          if (meta.content) {
            const binStr = atob(meta.content.replace(/\s/g, ''));
            const bytes = Uint8Array.from(binStr, c => c.charCodeAt(0));
            allUsers = JSON.parse(new TextDecoder('utf-8').decode(bytes));
            badge.innerText = `${allUsers.length} مشترك`;
            renderList();
            return;
          }
        }
      } catch (e) {}

      try {
        const res2 = await fetch(`https://raw.githubusercontent.com/aboyomna2006-cloud/Mikrotik/main/users.json?t=${Date.now()}`, { cache: 'no-store' });
        allUsers = await res2.json();
        badge.innerText = `${allUsers.length} مشترك`;
        renderList();
      } catch (e) {
        badge.innerText = 'خطأ في التحميل';
      }
    }

    function renderList() {
      const q = document.getElementById('qInput').value.trim().toLowerCase();
      const filtered = q
        ? allUsers.filter(u => (u.n && u.n.toLowerCase().includes(q)) || (u.c && u.c.toLowerCase().includes(q)))
        : allUsers;

      document.getElementById('countBadge').innerText = `${filtered.length} مشترك`;

      if (filtered.length === 0) {
        document.getElementById('usersListBox').innerHTML = '<div style="text-align:center;color:#9cb2cc;padding:24px;font-weight:700;">لا يوجد مشتركين مطابقين</div>';
        return;
      }

      const circ = 100.53;

      document.getElementById('usersListBox').innerHTML = filtered.map(u => {
        const rawName = (u.n || '').trim();
        const rawComm = (u.c || '').trim();
        const isArabicUser = rawName.startsWith('Arabic_User_');

        const usedGB = (Number(u.u || 0) / 1024);
        const limGB = Number(u.l || 0);
        const pct = limGB > 0 ? Math.min(100, Math.round((usedGB / limGB) * 100)) : 0;
        const offset = (circ - (pct / 100) * circ).toFixed(2);

        let redTipSvg = '';
        if (pct > 80) {
          const startLen = (0.8 * circ).toFixed(2);
          const redLen = (((pct - 80) / 100) * circ).toFixed(2);
          redTipSvg = `<circle class="m-fg-red" cx="20" cy="20" r="16" stroke-dasharray="${redLen} ${circ}" stroke-dashoffset="-${startLen}"/>`;
        }

        const quotaInfo = limGB > 0 ? `${usedGB.toFixed(1)}/${limGB} GB` : `${usedGB.toFixed(1)} GB`;

        let titleHtml = '';
        let subHtml = '';
        if (isArabicUser) {
          titleHtml = rawComm || rawName;
          subHtml = `<span class="u-meta-tag">${u.p || ''}</span> • ${quotaInfo}`;
        } else {
          titleHtml = rawName;
          subHtml = rawComm
            ? `${rawComm} • <span class="u-meta-tag">${quotaInfo}</span>`
            : `<span class="u-meta-tag">${u.p || ''}</span> • ${quotaInfo}`;
        }

        const safeAttrName = rawName.replace(/"/g, '&quot;');

        return `
          <div class="user-row" data-user="${safeAttrName}">
            <div class="u-info">
              <div class="u-primary">${titleHtml}</div>
              <div class="u-secondary">${subHtml}</div>
            </div>
            <div class="mini-ring-wrap">
              <svg viewBox="0 0 40 40">
                <circle class="m-bg" cx="20" cy="20" r="16"/>
                <circle class="m-fg" cx="20" cy="20" r="16" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/>
                ${redTipSvg}
              </svg>
              <span class="mini-pct">${pct}%</span>
            </div>
          </div>
        `;
      }).join('');

      bindRowGestures();
    }

    fetchUsers();
  </script>
</body>
</html>
