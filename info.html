<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>استعلام عن مشترك - WinBox</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b111a;
      --card-bg: #121c2a;
      --item-bg: #0c141f;
      --card-border: #263852;
      --accent-cyan: #00e5ff;
      --accent-amber: #ffab00;
      --accent-green: #00e676;
      --accent-red: #ff3d71;
      --text-main: #ffffff;
      --text-sub: #9cb2cc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text-main);
      padding: 12px;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .winbox-window {
      width: 100%;
      max-width: 450px;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 18px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }
    .win-header {
      background: linear-gradient(90deg, #162638, #121c2a);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
    }
    .win-title { font-size: 16px; font-weight: 800; color: var(--accent-cyan); }
    .win-badge { font-size: 12px; background: rgba(0, 230, 118, 0.16); color: var(--accent-green); padding: 4px 10px; border-radius: 8px; font-weight: 700; }

    .body-wrap { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .search-row { display: flex; gap: 8px; align-items: center; }
    .search-input {
      flex: 1;
      background: var(--item-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: #fff;
      padding: 11px 12px;
      font-size: 15px;
      outline: none;
      direction: ltr;
      text-align: left;
    }
    .search-input:focus { border-color: var(--accent-cyan); }
    .btn-clear {
      background: var(--item-bg);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      border-radius: 10px;
      padding: 0 12px;
      height: 42px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .list-box {
      max-height: 55vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .info-card {
      background: var(--item-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .ic-head { display: flex; justify-content: space-between; align-items: center; }
    .ic-name { font-size: 15px; font-weight: 800; color: #fff; direction: ltr; }
    .ic-prof { font-size: 12px; font-weight: 800; color: var(--accent-cyan); background: rgba(0, 229, 255, 0.12); padding: 2px 8px; border-radius: 6px; direction: ltr; }
    .ic-comm { font-size: 12px; color: var(--text-sub); direction: ltr; }

    .prog-bg { width: 100%; height: 8px; background: #192638; border-radius: 6px; overflow: hidden; }
    .prog-fill { height: 100%; border-radius: 6px; transition: width 0.3s; }

    .ic-stats { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--text-sub); }
    .ic-actions { display: flex; justify-content: flex-end; margin-top: 2px; }
    .btn-renew-mini {
      background: rgba(255, 171, 0, 0.14);
      border: 1px solid rgba(255, 171, 0, 0.4);
      color: var(--accent-amber);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .footer-btns { display: flex; gap: 8px; }
    .btn-back {
      flex: 1;
      background: rgba(0, 229, 255, 0.14);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      padding: 11px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      display: none;
    }
    .btn-close {
      flex: 1;
      background: rgba(255, 61, 113, 0.15);
      border: 1px solid var(--accent-red);
      color: var(--accent-red);
      padding: 11px;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="winbox-window">
    <div class="win-header">
      <div class="win-title">📋 استعلام عن مشترك</div>
      <div class="win-badge" id="countBadge">جاري التحميل...</div>
    </div>

    <div class="body-wrap">
      <div class="search-row">
        <input type="text" id="qInput" class="search-input" placeholder="اكتب اسم المشترك أو الكومنت..." oninput="renderCards()">
        <button type="button" class="btn-clear" onclick="clearSearch()">الكل</button>
      </div>
      <div class="list-box" id="cardsBox"></div>
      <div class="footer-btns">
        <button type="button" class="btn-back" id="btnBack" onclick="window.location.href='active.html'">↩️ رجوع للنشطين</button>
        <button type="button" class="btn-close" onclick="if(tg) tg.close()">إغلاق</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }

    let allUsers = [];
    const urlParams = new URLSearchParams(window.location.search);
    const preUser = urlParams.get('user');

    if (preUser) {
      document.getElementById('qInput').value = preUser;
      document.getElementById('btnBack').style.display = 'block';
    }

    function clearSearch() {
      document.getElementById('qInput').value = '';
      renderCards();
    }

    async function fetchUsers() {
      try {
        const res = await fetch(`https://raw.githubusercontent.com/aboyomna2006-cloud/Mikrotik/main/users.json?t=${Date.now()}`);
        allUsers = await res.json();
        document.getElementById('countBadge').innerText = `${allUsers.length} مشترك`;
        renderCards();
      } catch (e) {
        document.getElementById('countBadge').innerText = 'خطأ في التحميل';
      }
    }

    function renderCards() {
      const q = document.getElementById('qInput').value.trim().toLowerCase();
      const filtered = q
        ? allUsers.filter(u => (u.n && u.n.toLowerCase().includes(q)) || (u.c && u.c.toLowerCase().includes(q)))
        : allUsers.slice(0, 15);

      if (filtered.length === 0) {
        document.getElementById('cardsBox').innerHTML = '<div style="text-align:center;color:#9cb2cc;padding:20px;">لا توجد بيانات مطابقة لهذا المشترك</div>';
        return;
      }

      document.getElementById('cardsBox').innerHTML = filtered.map(u => {
        const title = u.n.startsWith('Arabic_User_') ? (u.c || u.n) : u.n;
        const usedGB = (u.u / 1024).toFixed(2);
        const limGB = u.l || 0;
        const pct = limGB > 0 ? Math.min(100, Math.round((usedGB / limGB) * 100)) : 0;
        const barColor = pct >= 90 ? '#ff3d71' : (pct >= 70 ? '#ffab00' : '#00e676');

        return `<div class="info-card">
          <div class="ic-head">
            <span class="ic-name">👤 ${title}</span>
            <span class="ic-prof">${u.p}</span>
          </div>
          <div class="ic-comm">💬 ${u.c || 'بدون كومنت'}</div>
          <div class="prog-bg"><div class="prog-fill" style="width:${pct}%; background:${barColor};"></div></div>
          <div class="ic-stats">
            <span>الاستهلاك: ${usedGB} GB (${pct}%)</span>
            <span>الباقة: ${limGB} GB</span>
          </div>
          <div class="ic-actions">
            <button type="button" class="btn-renew-mini" onclick="window.location.href='renew.html?user=${encodeURIComponent(u.n)}'">🔄 تجديد / تعديل</button>
          </div>
        </div>`;
      }).join('');
    }

    fetchUsers();
  </script>
</body>
</html>
