<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>استعلام عن مشترك - WinBox</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b111a;
      --card-bg: #121c2a;
      --card-border: #2a3c58;
      --accent-cyan: #00e5ff;
      --accent-amber: #ffab00;
      --accent-green: #00e676;
      --accent-red: #ff3d71;
      --text-main: #ffffff;
      --text-sub: #a3b8d1;
      --input-bg: #070d14;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text-main);
      padding: 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .winbox-window {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.75);
      overflow: hidden;
    }
    .win-header {
      background: linear-gradient(90deg, #162638, #121c2a);
      padding: 15px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
    }
    .win-title { font-size: 16px; font-weight: 800; color: var(--accent-cyan); }
    .win-badge { font-size: 12px; background: rgba(0, 230, 118, 0.16); color: var(--accent-green); padding: 4px 10px; border-radius: 8px; font-family: monospace; font-weight: 800; }

    .form-content { padding: 18px; display: flex; flex-direction: column; gap: 15px; }
    .search-row { display: flex; gap: 10px; }
    .win-input {
      flex: 1;
      background: var(--input-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      color: #fff;
      padding: 12px 15px;
      font-size: 16px;
      font-weight: 600;
      outline: none;
    }
    .win-input:focus { border-color: var(--accent-cyan); }
    .btn-search {
      background: linear-gradient(135deg, #0077ff, #00c3ff);
      border: none;
      color: #fff;
      border-radius: 12px;
      padding: 0 18px;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 195, 255, 0.3);
    }

    .info-card {
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.09), rgba(0, 119, 255, 0.09));
      border: 1.5px solid var(--accent-cyan);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .ic-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 10px;
    }
    .ic-user { font-size: 18px; font-weight: 800; color: #fff; font-family: monospace; }
    .ic-status { font-size: 12px; background: rgba(0, 230, 118, 0.18); color: var(--accent-green); padding: 4px 10px; border-radius: 8px; font-weight: 800; }
    .ic-status.disabled { background: rgba(255, 61, 113, 0.18); color: var(--accent-red); }
    .ic-comm { font-size: 14px; font-weight: 600; color: var(--accent-amber); font-family: monospace; line-height: 1.6; }
    
    .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
    .metric-box { background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 11px 6px; }
    .m-label { font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 4px; }
    .m-val { font-size: 16px; font-weight: 900; color: #fff; font-family: monospace; }

    .progress-section { display: flex; flex-direction: column; gap: 7px; }
    .progress-labels { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; color: #e2ecf7; }
    .progress-wrap {
      background: var(--input-bg);
      border-radius: 10px;
      height: 22px;
      overflow: hidden;
      border: 1.5px solid var(--card-border);
    }
    .progress-bar {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.85);
      transition: width 0.3s ease;
    }

    .multi-list { display: flex; flex-direction: column; gap: 8px; max-height: 210px; overflow-y: auto; }
    .multi-item { background: var(--input-bg); border: 1px solid var(--accent-cyan); border-radius: 12px; padding: 10px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
    .status-note { font-size: 13px; color: var(--text-sub); text-align: center; padding: 8px; }
    .btn-close { width: 100%; background: rgba(255, 61, 113, 0.15); border: 1px solid var(--accent-red); color: var(--accent-red); padding: 12px; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; }
  </style>
</head>
<body>
  <div class="winbox-window">
    <div class="win-header">
      <div class="win-title">📋 استعلام عن مشترك</div>
      <div class="win-badge" id="syncBadge">جاري الاتصال...</div>
    </div>

    <div class="form-content">
      <div class="search-row">
        <input type="text" id="inQuery" class="win-input" dir="auto" placeholder="اكتب اسم أو رقم المشترك..." onkeydown="if(event.key==='Enter') searchUsers()">
        <button class="btn-search" onclick="searchUsers()" title="بحث">🔍</button>
      </div>

      <div id="resultArea">
        <div class="status-note">اكتب اسم المشترك أو جزء من الكومنت واضغط على العدسة 🔍</div>
      </div>

      <button class="btn-close" onclick="if(tg) tg.close()">إغلاق</button>
    </div>
  </div>

  <script>
    let allUsers = [];
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }

    async function loadUsers() {
      try {
        const url = `https://raw.githubusercontent.com/aboyomna2006-cloud/Mikrotik/main/users.json?t=${Date.now()}`;
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        allUsers = await res.json();
        document.getElementById('syncBadge').innerText = `متصل • ${allUsers.length} مشترك`;
      } catch (e) {
        document.getElementById('syncBadge').innerText = 'غير متصل';
      }
    }

    function showCard(u) {
      const usedGB = u.u / 1024;
      const limitGB = u.l || 0;
      const remGB = limitGB > 0 ? Math.max(0, limitGB - usedGB).toFixed(2) + ' GB' : 'مفتوح';
      let pct = limitGB > 0 ? Math.min(100, Math.round((usedGB / limitGB) * 100)) : 0;
      let barBg = 'linear-gradient(90deg, #00c853, #00e676)';
      if (pct >= 85) barBg = 'linear-gradient(90deg, #ff8f00, #ff3d71)';
      else if (pct >= 60) barBg = 'linear-gradient(90deg, #00b0ff, #ffab00)';

      const statusHtml = u.d
        ? `<span class="ic-status disabled">معطّل (Disabled)</span>`
        : `<span class="ic-status">نشط (Enabled) ✓</span>`;

      document.getElementById('resultArea').innerHTML = `
        <div class="info-card">
          <div class="ic-header">
            <span class="ic-user" dir="auto">👤 ${u.n}</span>
            ${statusHtml}
          </div>
          <div class="ic-comm" dir="auto">💬 ${u.c || 'بدون كومنت'}</div>
          <div class="metrics-grid">
            <div class="metric-box">
              <div class="m-label">البروفايل</div>
              <div class="m-val" style="color:#00e5ff;">${u.p}</div>
            </div>
            <div class="metric-box">
              <div class="m-label">الباقة</div>
              <div class="m-val">${limitGB > 0 ? limitGB + ' GB' : '∞'}</div>
            </div>
            <div class="metric-box">
              <div class="m-label">المتبقي</div>
              <div class="m-val" style="color:#00e676;">${remGB}</div>
            </div>
          </div>
          ${limitGB > 0 ? `
          <div class="progress-section">
            <div class="progress-labels">
              <span>المستهلك: ${usedGB.toFixed(2)} GB</span>
              <span>من أصل ${limitGB} GB</span>
            </div>
            <div class="progress-wrap">
              <div class="progress-bar" style="width:${Math.max(pct, 12)}%;background:${barBg};">${pct}%</div>
            </div>
          </div>` : ''}
        </div>
      `;
    }

    function searchUsers() {
      const q = document.getElementById('inQuery').value.trim().toLowerCase();
      if (!q) return alert('اكتب كلمة للبحث أولاً');
      let matches = allUsers.filter(u => u.n.toLowerCase() === q);
      if (matches.length === 0) {
        matches = allUsers.filter(u => u.n.toLowerCase().includes(q) || (u.c && u.c.toLowerCase().includes(q)));
      }
      if (matches.length === 0) {
        document.getElementById('resultArea').innerHTML = `<div class="status-note" style="color:#ff3d71;">❌ لا يوجد مشترك مطابق</div>`;
      } else if (matches.length === 1) {
        showCard(matches[0]);
      } else {
        let html = `<div class="status-note">اختر المشترك (${matches.length} نتائج):</div><div class="multi-list">`;
        matches.forEach((m, idx) => {
          html += `<div class="multi-item" onclick="showCard(window._m[${idx}])">
            <b style="color:#fff;font-size:15px;" dir="auto">👤 ${m.n}</b>
            <span style="color:#ffab00;font-size:12px;" dir="auto">💬 ${m.c || ''}</span>
          </div>`;
        });
        html += `</div>`;
        window._m = matches;
        document.getElementById('resultArea').innerHTML = html;
      }
    }

    loadUsers();
  </script>
</body>
</html>
