<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>استعلام عن مشترك - WinBox</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b111a;
      --card-bg: #121c2a;
      --item-bg: #0c141f;
      --card-border: #263852;
      --accent-cyan: #00e5ff;
      --accent-amber: #ffab00;
      --accent-green: #00e676;
      --accent-red: #ff3d71;
      --text-main: #ffffff;
      --text-sub: #9cb2cc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text-main);
      padding: 12px;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .winbox-window {
      width: 100%;
      max-width: 450px;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 18px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }
    .win-header {
      background: linear-gradient(90deg, #162638, #121c2a);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
    }
    .win-title { font-size: 16px; font-weight: 800; color: var(--accent-cyan); }
    .win-badge { font-size: 12px; background: rgba(0, 230, 118, 0.16); color: var(--accent-green); padding: 4px 10px; border-radius: 8px; font-weight: 700; }

    .body-wrap { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .search-row { display: flex; gap: 8px; align-items: center; }
    .search-input {
      flex: 1;
      background: var(--item-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: #fff;
      padding: 11px 12px;
      font-size: 15px;
      outline: none;
      direction: ltr;
      text-align: left;
    }
    .search-input:focus { border-color: var(--accent-cyan); }
    .btn-clear {
      background: var(--item-bg);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      border-radius: 10px;
      padding: 0 12px;
      height: 42px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .list-box {
      max-height: 62vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .info-card {
      background: var(--item-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ic-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .ic-name { font-size: 15px; font-weight: 800; color: #fff; direction: ltr; }
    .ic-prof { font-size: 12px; font-weight: 800; color: var(--accent-cyan); background: rgba(0, 229, 255, 0.12); padding: 2px 8px; border-radius: 6px; direction: ltr; white-space: nowrap; }
    .ic-comm { font-size: 12px; color: var(--text-sub); direction: ltr; padding-bottom: 8px; border-bottom: 1px dashed rgba(38, 56, 82, 0.7); }

    /* الدائرة الكبيرة المصمتة مكان الشريط - معكوسة الألوان: المسحوب أحمر نيون والمتبقي أخضر نيون */
    .pie-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 0 4px;
    }
    .pie-disc {
      position: relative;
      width: 165px;
      height: 165px;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        #ff1744 0%,
        #ff4d6d var(--pct, 0%),
        #00ff88 var(--pct, 0%),
        #00c853 100%
      );
      box-shadow:
        0 0 28px rgba(255, 23, 68, 0.48),
        0 0 24px rgba(0, 255, 136, 0.38),
        inset 0 3px 10px rgba(255, 255, 255, 0.35),
        inset 0 -6px 14px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease;
    }
    .pie-disc::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.28), transparent 60%);
      pointer-events: none;
    }
    .pie-label {
      position: relative;
      z-index: 2;
      font-size: 32px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85), 0 0 14px rgba(255, 255, 255, 0.45);
      letter-spacing: -0.5px;
    }

    .ic-stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.03);
      padding: 8px 10px;
      border-radius: 9px;
      border: 1px solid rgba(38, 56, 82, 0.5);
    }
    .st-used { color: var(--accent-red); text-shadow: 0 0 10px rgba(255, 61, 113, 0.45); }
    .st-total { color: var(--text-main); }
    .st-rem { color: var(--accent-green); text-shadow: 0 0 10px rgba(0, 230, 118, 0.4); }

    .ic-actions { display: flex; justify-content: center; margin-top: 2px; }
    .btn-renew-mini {
      width: 100%;
      background: rgba(255, 171, 0, 0.14);
      border: 1px solid rgba(255, 171, 0, 0.45);
      color: var(--accent-amber);
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .footer-btns { display: flex; gap: 8px; }
    .btn-back {
      flex: 1;
      background: rgba(0, 229, 255, 0.14);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      padding: 11px;
      border-radius: 11px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-close {
      flex: 1;
      background: rgba(255, 61, 113, 0.15);
      border: 1px solid var(--accent-red);
      color: var(--accent-red);
      padding: 11px;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="winbox-window">
    <div class="win-header">
      <div class="win-title">📋 استعلام عن مشترك</div>
      <div class="win-badge" id="countBadge">جاري التحميل...</div>
    </div>

    <div class="body-wrap">
      <div class="search-row">
        <input type="text" id="qInput" class="search-input" placeholder="اكتب اسم المشترك أو الكومنت..." oninput="renderCards()">
        <button type="button" class="btn-clear" onclick="clearSearch()">الكل</button>
      </div>
      <div class="list-box" id="cardsBox"></div>
      <div class="footer-btns">
        <button type="button" class="btn-back" onclick="window.location.href='dashboard.html'">🏠 الرئيسية</button>
        <button type="button" class="btn-close" onclick="if(tg) tg.close()">إغلاق</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }

    let allUsers = [];
    const urlParams = new URLSearchParams(window.location.search);
    const preUser = urlParams.get('user');

    if (preUser) {
      document.getElementById('qInput').value = preUser;
    }

    function clearSearch() {
      document.getElementById('qInput').value = '';
      renderCards();
    }

    async function fetchUsers() {
      try {
        const res = await fetch(`https://raw.githubusercontent.com/aboyomna2006-cloud/Mikrotik/main/users.json?t=${Date.now()}`);
        allUsers = await res.json();
        document.getElementById('countBadge').innerText = `${allUsers.length} مشترك`;
        renderCards();
      } catch (e) {
        document.getElementById('countBadge').innerText = 'خطأ في التحميل';
      }
    }

    function renderCards() {
      const q = document.getElementById('qInput').value.trim().toLowerCase();
      const filtered = q
        ? allUsers.filter(u => (u.n && u.n.toLowerCase().includes(q)) || (u.c && u.c.toLowerCase().includes(q)))
        : allUsers.slice(0, 15);

      if (filtered.length === 0) {
        document.getElementById('cardsBox').innerHTML = '<div style="text-align:center;color:#9cb2cc;padding:20px;">لا توجد بيانات مطابقة لهذا المشترك</div>';
        return;
      }

      document.getElementById('cardsBox').innerHTML = filtered.map(u => {
        const title = u.n.startsWith('Arabic_User_') ? (u.c || u.n) : u.n;
        const usedNum = (u.u / 1024);
        const usedGB = usedNum.toFixed(2);
        const limGB = u.l || 0;
        const remGB = Math.max(0, limGB - usedNum).toFixed(2);
        const pct = limGB > 0 ? Math.min(100, Math.round((usedNum / limGB) * 100)) : 0;

        return `<div class="info-card">
          <div class="ic-head">
            <span class="ic-name">👤 ${title}</span>
            <span class="ic-prof">${u.p}</span>
          </div>
          <div class="ic-comm">💬 ${u.c || 'بدون كومنت'}</div>

          <div class="pie-container">
            <div class="pie-disc" style="--pct:${pct}%;">
              <span class="pie-label">${pct}%</span>
            </div>
          </div>

          <div class="ic-stats">
            <span class="st-used">الاستهلاك: ${usedGB} GB</span>
            <span class="st-total">الباقة: ${limGB} GB</span>
            <span class="st-rem">المتبقي: ${remGB} GB</span>
          </div>

          <div class="ic-actions">
            <button type="button" class="btn-renew-mini" onclick="window.location.href='renew.html?user=${encodeURIComponent(u.n)}'">🔄 تجديد / تعديل</button>
          </div>
        </div>`;
      }).join('');
    }

    fetchUsers();
  </script>
</body>
</html>
