<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تجديد وتعديل مشترك - WinBox</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b111a;
      --card-bg: #121c2a;
      --item-bg: #0c141f;
      --card-border: #263852;
      --accent-cyan: #00e5ff;
      --accent-amber: #ffab00;
      --accent-green: #00e676;
      --accent-red: #ff3d71;
      --text-main: #ffffff;
      --text-sub: #9cb2cc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text-main);
      padding: 12px;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .winbox-window {
      width: 100%;
      max-width: 450px;
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 18px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }
    .win-header {
      background: linear-gradient(90deg, #162638, #121c2a);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
    }
    .win-title { font-size: 16px; font-weight: 800; color: var(--accent-amber); }
    .win-badge { font-size: 12px; background: rgba(0, 230, 118, 0.16); color: var(--accent-green); padding: 4px 10px; border-radius: 8px; font-weight: 700; }

    .form-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
    .field-group { display: flex; flex-direction: column; gap: 6px; position: relative; }
    .label-row { display: flex; justify-content: space-between; align-items: center; }
    .field-label { font-size: 13px; color: var(--text-sub); font-weight: 700; }
    .hint-tag { font-size: 11px; color: var(--accent-amber); font-weight: 700; }

    .search-row { display: flex; gap: 8px; }
    .text-input, .select-input {
      flex: 1;
      width: 100%;
      background: var(--item-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: #fff;
      padding: 11px 12px;
      font-size: 15px;
      outline: none;
      direction: ltr;
      text-align: left;
    }
    .text-input:focus, .select-input:focus { border-color: var(--accent-cyan); }
    .btn-search {
      background: linear-gradient(135deg, #00b0ff, #0077c2);
      border: none;
      border-radius: 10px;
      padding: 0 14px;
      font-size: 18px;
      cursor: pointer;
    }

    .results-box {
      background: #0a1019;
      border: 1px solid var(--accent-cyan);
      border-radius: 10px;
      max-height: 170px;
      overflow-y: auto;
      display: none;
    }
    .res-item {
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .res-item:last-child { border-bottom: none; }
    .res-item:active { background: rgba(0, 229, 255, 0.15); }
    .res-name { font-size: 14px; font-weight: 800; color: #fff; direction: ltr; }
    .res-sub { font-size: 12px; color: var(--text-sub); direction: ltr; }

    .btn-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 6px; }
    .btn-grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1.2fr; gap: 6px; }
    .opt-btn {
      background: var(--item-bg);
      border: 1.5px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 4px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }
    .opt-btn.active {
      background: linear-gradient(135deg, #ffab00, #ff6d00);
      border-color: #ffd54f;
      color: #0b111a;
      font-weight: 900;
      box-shadow: 0 4px 14px rgba(255, 171, 0, 0.35);
    }
    .opt-btn.keep-btn.active {
      background: linear-gradient(135deg, #00e5ff, #0091ea);
      border-color: #80d8ff;
      color: #08121e;
    }

    .actions-row { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 6px; }
    .btn-cancel {
      background: rgba(255, 61, 113, 0.15);
      border: 1px solid var(--accent-red);
      color: var(--accent-red);
      padding: 12px;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-submit {
      background: linear-gradient(90deg, #ffab00, #00e676);
      border: none;
      color: #08121e;
      padding: 12px;
      border-radius: 11px;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="winbox-window">
    <div class="win-header">
      <div class="win-title">🔄 تجديد / تعديل مشترك</div>
      <div class="win-badge" id="statusBadge">جاري التحميل...</div>
    </div>

    <div class="form-body">
      <div class="field-group">
        <div class="label-row">
          <label class="field-label">🔍 ابحث باليوزر أو الكومنت</label>
          <span class="hint-tag">إنجليزي / أرقام</span>
        </div>
        <div class="search-row">
          <input type="text" id="searchQuery" class="text-input" placeholder="مثال: Abdo أو Antar..." oninput="doSearch()">
          <button type="button" class="btn-search" onclick="doSearch()">🔍</button>
        </div>
        <div class="results-box" id="resultsBox"></div>
      </div>

      <div class="field-group">
        <div class="label-row">
          <label class="field-label">💬 الكومنت (يعرض الحالي لتعدله براحتك)</label>
          <span class="hint-tag">تعديل يدوي</span>
        </div>
        <input type="text" id="newComment" class="text-input" placeholder="يظهر الكومنت الحالي عند اختيار المشترك...">
      </div>

      <div class="field-group">
        <div class="label-row">
          <label class="field-label">🚀 البروفايل (اختر أو عدّل من القائمة)</label>
          <span class="hint-tag" id="currProfTag">الحالي: -</span>
        </div>
        <div class="btn-grid-2">
          <button type="button" class="opt-btn active" id="prof_512" onclick="setProfile('512+')">512+ (الأساسي)</button>
          <button type="button" class="opt-btn" id="prof_120" onclick="setProfile('120K/400K')">120K/400K</button>
        </div>
        <select id="profSelect" class="select-input" onchange="setProfile(this.value)">
          <option value="512+">512+</option>
          <option value="120K/400K">120K/400K</option>
          <option value="120K/400K 2 User">120K/400K 2 User</option>
          <option value="512">512</option>
          <option value="512X2">512X2</option>
          <option value="1M">1M</option>
          <option value="1M/2">1M/2</option>
          <option value="1M/5">1M/5</option>
          <option value="2M">2M</option>
          <option value="3M">3M</option>
          <option value="4M">4M</option>
          <option value="5M/5M">5M/5M</option>
          <option value="8M">8M</option>
          <option value="close">close</option>
          <option value="default">default</option>
          <option value="Please today end day">Please today end day</option>
        </select>
      </div>

      <div class="field-group">
        <label class="field-label">📦 الباقة (اختر "بدون تصفير" لتعديل البروفايل والكومنت فقط)</label>
        <div class="btn-grid-4">
          <button type="button" class="opt-btn" id="gb_12" onclick="selectGb('12', this)">12 جيجا</button>
          <button type="button" class="opt-btn active" id="gb_15" onclick="selectGb('15', this)">15 جيجا</button>
          <button type="button" class="opt-btn" id="gb_20" onclick="selectGb('20', this)">20 جيجا</button>
          <button type="button" class="opt-btn keep-btn" id="gb_0" onclick="selectGb('0', this)">بدون تصفير</button>
        </div>
      </div>

      <div class="actions-row">
        <button type="button" class="btn-cancel" onclick="if(tg) tg.close()">إلغاء</button>
        <button type="button" class="btn-submit" onclick="submitRenew()">✅ حفظ التعديل</button>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }

    let usersList = [];
    let selectedTarget = '';
    let selectedProf = '512+';
    let selectedGb = '15';

    async function loadUsers() {
      try {
        const res = await fetch(`https://raw.githubusercontent.com/aboyomna2006-cloud/Mikrotik/main/users.json?t=${Date.now()}`, { cache: 'no-store' });
        usersList = await res.json();
        document.getElementById('statusBadge').innerText = `متصل • ${usersList.length} مشترك`;
      } catch (e) {
        document.getElementById('statusBadge').innerText = 'وضع يدوي';
      }
    }

    function doSearch() {
      const q = document.getElementById('searchQuery').value.trim().toLowerCase();
      selectedTarget = document.getElementById('searchQuery').value.trim();
      const box = document.getElementById('resultsBox');
      if (!q || usersList.length === 0) {
        box.style.display = 'none';
        return;
      }
      const matches = usersList.filter(u =>
        (u.n && u.n.toLowerCase().includes(q)) ||
        (u.c && u.c.toLowerCase().includes(q))
      ).slice(0, 12);

      if (matches.length === 0) {
        box.style.display = 'none';
        return;
      }

      box.innerHTML = matches.map(u => {
        const title = u.n.startsWith('Arabic_User_') ? (u.c || u.n) : u.n;
        const sub = u.c || u.n;
        return `<div class="res-item" onclick='pickUser(${JSON.stringify(u)})'>
          <div>
            <div class="res-name">${title}</div>
            <div class="res-sub">${sub}</div>
          </div>
          <div class="res-sub">${u.p} • ${u.l}G</div>
        </div>`;
      }).join('');
      box.style.display = 'block';
    }

    function setProfile(val) {
      selectedProf = val;
      document.getElementById('profSelect').value = val;
      document.getElementById('prof_512').classList.toggle('active', val === '512+');
      document.getElementById('prof_120').classList.toggle('active', val === '120K/400K');
    }

    function pickUser(u) {
      const isArabic = u.n.startsWith('Arabic_User_');
      selectedTarget = isArabic ? u.id : u.n;
      document.getElementById('searchQuery').value = isArabic ? (u.c || u.n) : u.n;
      document.getElementById('resultsBox').style.display = 'none';

      // عرض الكومنت الحالي كما هو لتعدله براحتك
      document.getElementById('newComment').value = u.c || '';

      // عرض البروفايل الحالي في القائمة والشارة
      document.getElementById('currProfTag').innerText = `الحالي: ${u.p}`;
      setProfile(u.p || '512+');

      // اختيار الباقة المناسبة (لو متوقف يختار "بدون تصفير" تلقائياً)
      if (u.p === 'Please today end day' || u.p === 'close') {
        selectGb('0', document.getElementById('gb_0'));
      } else if (u.l == 12) {
        selectGb('12', document.getElementById('gb_12'));
      } else if (u.l == 20) {
        selectGb('20', document.getElementById('gb_20'));
      } else {
        selectGb('15', document.getElementById('gb_15'));
      }
    }

    function selectGb(val, el) {
      selectedGb = val;
      el.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }

    function submitRenew() {
      const q = selectedTarget || document.getElementById('searchQuery').value.trim();
      const comm = document.getElementById('newComment').value.trim();
      if (!q) {
        alert('برجاء إدخال أو اختيار اسم المشترك أولاً');
        return;
      }
      const payload = `/renew_user|${q}|${selectedProf}|${selectedGb}|${comm}`;
      if (tg) {
        tg.sendData(payload);
      } else {
        alert(payload);
      }
    }

    loadUsers();
  </script>
</body>
</html>
