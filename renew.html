<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تجديد باقة مشترك - WinBox</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b111a;
      --card-bg: #121c2a;
      --card-border: #26354d;
      --accent-amber: #ffab00;
      --accent-cyan: #00e5ff;
      --accent-blue: #0077ff;
      --accent-green: #00e676;
      --accent-red: #ff3d71;
      --text-main: #f0f4f8;
      --text-sub: #889bb3;
      --input-bg: #070d14;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text-main); padding: 14px; min-height: 100vh; }
    .winbox-window { width: 100%; max-width: 440px; margin: 0 auto; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; box-shadow: 0 12px 35px rgba(0, 0, 0, 0.65); overflow: hidden; }
    
    .win-header { background: linear-gradient(90deg, #1f2636, #172030); padding: 13px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--card-border); }
    .win-title { font-size: 15px; font-weight: 800; color: var(--accent-amber); }
    .win-badge { font-size: 11px; background: rgba(0, 230, 118, 0.15); color: var(--accent-green); padding: 3px 9px; border-radius: 6px; font-family: monospace; font-weight: 700; }

    .form-content { padding: 14px 16px 16px 16px; display: flex; flex-direction: column; gap: 13px; }
    .field-group { display: flex; flex-direction: column; gap: 6px; }
    .field-header { display: flex; justify-content: space-between; align-items: center; }
    .field-label { font-size: 13px; font-weight: 600; color: var(--text-sub); }
    .field-hint { font-size: 11px; color: var(--accent-amber); }

    .search-row { display: flex; gap: 8px; }
    .win-input { flex: 1; background: var(--input-bg); border: 1px solid var(--card-border); border-radius: 10px; color: #fff; padding: 11px 14px; font-size: 15px; outline: none; transition: border-color 0.2s; }
    .win-input:focus { border-color: var(--accent-amber); }
    .btn-search { background: linear-gradient(135deg, #0077ff, #00c3ff); border: none; color: #fff; border-radius: 10px; padding: 0 16px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(0, 195, 255, 0.25); }

    .user-card { background: linear-gradient(135deg, rgba(0, 229, 255, 0.08), rgba(255, 171, 0, 0.08)); border: 1px solid var(--accent-cyan); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
    .uc-top { display: flex; justify-content: space-between; align-items: center; }
    .uc-name { font-size: 16px; font-weight: 800; color: #fff; font-family: monospace; }
    .uc-status { font-size: 11px; background: rgba(0, 230, 118, 0.15); color: var(--accent-green); padding: 2px 8px; border-radius: 6px; font-weight: 700; }
    .uc-status.disabled { background: rgba(255, 61, 113, 0.15); color: var(--accent-red); }
    .uc-comm { font-size: 12px; color: var(--accent-amber); font-family: monospace; }
    .uc-stats { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-sub); margin-top: 2px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 6px; }
    .uc-stats b { color: #fff; }

    .multi-list { display: flex; flex-direction: column; gap: 6px; max-height: 190px; overflow-y: auto; }
    .multi-item { background: var(--input-bg); border: 1px solid var(--accent-amber); border-radius: 10px; padding: 9px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
    .multi-item:active { background: #192638; }

    .options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .opt-btn { background: var(--input-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 11px 4px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; transition: all 0.15s; }
    .opt-btn.active { background: linear-gradient(135deg, #ff8f00, #ffca28); color: #0b111a; border-color: #ffe082; box-shadow: 0 4px 12px rgba(255, 171, 0, 0.25); }

    .actions-footer { display: flex; gap: 10px; margin-top: 4px; }
    .btn-renew { flex: 2; background: linear-gradient(135deg, #ffab00, #00e676); color: #05141f; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 800; cursor: pointer; }
    .btn-cancel { flex: 1; background: rgba(255, 61, 113, 0.15); border: 1px solid var(--accent-red); color: var(--accent-red); padding: 14px; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
    .status-note { font-size: 12px; color: var(--text-sub); text-align: center; padding: 6px; }
  </style>
</head>
<body>
  <div class="winbox-window">
    <div class="win-header">
      <div class="win-title">🔄 تجديد باقة مشترك</div>
      <div class="win-badge" id="syncBadge">جاري الاتصال...</div>
    </div>

    <div class="form-content">
      <div class="field-group">
        <div class="field-header">
          <label class="field-label">🔍 ابحث باليوزر أو الكومنت ثم اضغط العدسة</label>
          <span class="field-hint">إنجليزي / أرقام</span>
        </div>
        <div class="search-row">
          <input type="text" id="inQuery" class="win-input" dir="auto" placeholder="مثال: Antar أو Sama أو masoud..." onkeydown="if(event.key==='Enter') searchUsers()">
          <button class="btn-search" onclick="searchUsers()" title="بحث">🔍</button>
        </div>
      </div>

      <div id="resultArea"></div>

      <div class="field-group">
        <div class="field-header">
          <label class="field-label">💬 الكومنت الجديد (+30 يوم تلقائياً)</label>
          <span class="field-hint">قابل للتعديل اليدوي</span>
        </div>
        <input type="text" id="inNewComm" class="win-input" dir="auto" placeholder="يتعبأ تلقائياً عند اختيار المشترك...">
      </div>

      <div class="field-group">
        <label class="field-label">🚀 البروفايل بعد التجديد</label>
        <div class="options-grid" style="grid-template-columns: repeat(2, 1fr);">
          <button class="opt-btn active" id="prof1" onclick="setProfile('512+', this)">512+ (الأساسي)</button>
          <button class="opt-btn" id="prof2" onclick="setProfile('120K/400K', this)">120K/400K</button>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">📦 الباقة الجديدة (الجيجات)</label>
        <div class="options-grid">
          <button class="opt-btn" id="q12" onclick="setQuota(12, this)">12 جيجا</button>
          <button class="opt-btn active" id="q15" onclick="setQuota(15, this)">15 جيجا</button>
          <button class="opt-btn" id="q20" onclick="setQuota(20, this)">20 جيجا</button>
        </div>
      </div>

      <div class="actions-footer">
        <button class="btn-renew" onclick="submitRenew()">🔄 حفظ وتجديد الباقة</button>
        <button class="btn-cancel" onclick="cancelAction()">إلغاء</button>
      </div>
    </div>
  </div>

  <script>
    let allUsers = [];
    let selectedUser = null;
    let currentProfile = '512+';
    let currentQuota = 15;

    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) { tg.ready(); tg.expand(); }

    async function loadUsers() {
      try {
        const url = `https://raw.githubusercontent.com/aboyomna2006-cloud/Mikrotik/main/users.json?t=${Date.now()}`;
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const textData = await res.text();
        allUsers = JSON.parse(textData);
        document.getElementById('syncBadge').innerText = `متصل • ${allUsers.length} مشترك`;
      } catch (e) {
        document.getElementById('syncBadge').innerText = 'وضع البحث المباشر';
      }
    }

    function computePlus30Comment(oldComm, userName) {
      let baseName = userName;
      let targetDate = null;

      if (oldComm && oldComm.trim().length > 0) {
        const toIdx = oldComm.indexOf(' To ');
        if (toIdx !== -1) {
          baseName = oldComm.substring(0, toIdx).trim();
          const afterTo = oldComm.substring(toIdx + 4).trim();
          const dateToken = afterTo.split(/\s+/)[0];
          const parts = dateToken.split('-');
          if (parts.length === 3) {
            const d = parseInt(parts[0], 10);
            const m = parseInt(parts[1], 10) - 1;
            const y = parseInt(parts[2], 10);
            if (!isNaN(d) && !isNaN(m) && !isNaN(y) && y > 2000) {
              targetDate = new Date(y, m, d);
            }
          }
        } else {
          baseName = oldComm.trim();
        }
      }

      if (!targetDate) {
        targetDate = new Date();
      }
      targetDate.setDate(targetDate.getDate() + 30);

      const day = targetDate.getDate();
      const month = targetDate.getMonth() + 1;
      const year = targetDate.getFullYear();
      return `${baseName} To ${day}-${month}-${year}`;
    }

    function selectUserCard(u) {
      selectedUser = u;
      const displayName = u.n.startsWith('Arabic_User_') ? (u.c.split(' To ')[0] || u.n) : u.n;
      document.getElementById('inQuery').value = displayName;
      document.getElementById('inNewComm').value = computePlus30Comment(u.c, displayName);

      if ([12, 15, 20].includes(u.l)) {
        const btn = document.getElementById('q' + u.l);
        if (btn) setQuota(u.l, btn);
      }

      const usedGB = (u.u / 1024).toFixed(2);
      const statusHtml = u.d
        ? `<span class="uc-status disabled">معطّل (Disabled)</span>`
        : `<span class="uc-status">نشط (Enabled) ✓</span>`;

      document.getElementById('resultArea').innerHTML = `
        <div class="user-card">
          <div class="uc-top">
            <span class="uc-name" dir="auto">👤 ${u.n}</span>
            ${statusHtml}
          </div>
          <div class="uc-comm" dir="auto">💬 ${u.c || 'بدون كومنت'}</div>
          <div class="uc-stats">
            <span>البروفايل: <b>${u.p}</b></span>
            <span>الباقة: <b>${u.l} GB</b></span>
            <span>المستهلك: <b>${usedGB} GB</b></span>
          </div>
        </div>
      `;
    }

    function searchUsers() {
      const q = document.getElementById('inQuery').value.trim();
      if (!q) return alert('اكتب اسم المستخدم أو كلمة من الكومنت أولاً');
      selectedUser = null;

      if (allUsers.length === 0) {
        document.getElementById('resultArea').innerHTML = `<div class="status-note">سيتم البحث وتنفيذ التجديد مباشرة عبر البوت لـ: <b>${q}</b></div>`;
        return;
      }

      const qLower = q.toLowerCase();
      let matches = allUsers.filter(u => u.n.toLowerCase() === qLower);
      if (matches.length === 0) {
        matches = allUsers.filter(u =>
          u.n.toLowerCase().includes(qLower) || (u.c && u.c.toLowerCase().includes(qLower))
        );
      }

      if (matches.length === 0) {
        document.getElementById('resultArea').innerHTML = `<div class="status-note" style="color:#ff3d71;">❌ لم يتم العثور على مشترك مطابق في القائمة</div>`;
      } else if (matches.length === 1) {
        selectUserCard(matches[0]);
      } else {
        let html = `<div class="field-hint" style="margin-bottom:5px;">اختر المشترك المقصود (${matches.length} نتائج):</div><div class="multi-list">`;
        matches.forEach((m, idx) => {
          html += `<div class="multi-item" onclick='selectUserByIndex(${idx})'>
            <b style="color:#fff;font-size:14px;" dir="auto">👤 ${m.n}</b>
            <span style="color:#ffab00;font-size:12px;" dir="auto">💬 ${m.c || 'بدون كومنت'} (${m.p} • ${m.l}GB)</span>
          </div>`;
        });
        html += `</div>`;
        window._lastMatches = matches;
        document.getElementById('resultArea').innerHTML = html;
      }
    }

    function selectUserByIndex(idx) {
      if (window._lastMatches && window._lastMatches[idx]) {
        selectUserCard(window._lastMatches[idx]);
      }
    }

    function setProfile(prof, btn) {
      currentProfile = prof;
      document.querySelectorAll('#prof1, #prof2').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function setQuota(gb, btn) {
      currentQuota = gb;
      btn.parentElement.querySelectorAll('.opt-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function submitRenew() {
      const target = selectedUser ? (selectedUser.id || selectedUser.n) : document.getElementById('inQuery').value.trim();
      const newComm = document.getElementById('inNewComm').value.trim();
      if (!target) return alert('ابحث عن المشترك أو اكتب اسمه أولاً');

      const cmdText = `/renew_user|${target}|${currentProfile}|${currentQuota}|${newComm}`;
      if (tg && tg.sendData) tg.sendData(cmdText);
    }

    function cancelAction() { if (tg) tg.close(); }
    loadUsers();
  </script>
</body>
</html>
